# DigitalOcean App Platform spec — GoSource customer web (Nuxt SSR).
#
# Create:  doctl apps create --spec .do/customer-web.app.yaml
# Update:  doctl apps update <APP_ID> --spec .do/customer-web.app.yaml
#
# Region slugs: nyc ams fra lon sfo sgp blr tor syd
name: gosource-customer-web
region: sfo
services:
  - name: customer-web
    # Built from the repo root (pnpm workspace) using the app's Dockerfile.
    dockerfile_path: apps/customer-web/Dockerfile
    source_dir: /
    github:
      repo: ipcafrica/gosource-lab-v2
      branch: dev
      deploy_on_push: true
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    routes:
      - path: /
    envs:
      # ── REQUIRED: where the deployed legacy-api lives (server-side fetches) ──
      - key: NUXT_LEGACY_API_BASE_URL
        scope: RUN_TIME
        value: https://REPLACE-with-your-api-host

      # ── Public values — baked into the client bundle at build time ──
      - key: NUXT_PUBLIC_PAYSTACK_PUBLIC_KEY
        scope: RUN_AND_BUILD_TIME
        value: pk_live_REPLACE
      - key: NUXT_PUBLIC_GOOGLE_MAPS_API_KEY
        scope: RUN_AND_BUILD_TIME
        value: REPLACE

# Add your domain once DNS is pointed at the app:
# domains:
#   - domain: shop.gosource.example
#     type: PRIMARY
