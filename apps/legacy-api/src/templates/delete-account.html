<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Email Template</title>
	<link href="https://fonts.cdnfonts.com/css/graphik-trial" rel="stylesheet">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
		rel="stylesheet">
</head>

<body>
	<table style="width: 100%; max-width: 600px; margin: 0 auto; background-color: #fff;">
		<style>
			@import url('https://fonts.cdnfonts.com/css/graphik-trial');
			@import url('https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap');
		</style>
		<tr>
			<td>
				<table style="width: 100%; max-width: 600px; margin: 0 auto; background-color: #fff;">
					<tr>
						<td style="text-align: left; font-weight: 400; line-height: 21px; letter-spacing: -0.2px; color: #101928; font-family: 'Inter', 'Arial', sans-serif; width: 100%; background-color: #09420C; color: #fff; padding: 24px; font-size: 24px; font-weight: bold; margin-left: 0;"
							colspan="2">
							<img src="https://gosource.sfo3.cdn.digitaloceanspaces.com/Frame%201000002518.png"
								alt="">
						</td>
					</tr>
				</table>
				<table
					style="max-width: 600px; margin: 0 auto; background-color: #fff; padding-top: 40px; padding-right: 24px; padding-left: 24px;">
					<tr>
						<td colspan="2" style="margin: 0 auto;">
							<img src="https://gosource.sfo3.cdn.digitaloceanspaces.com/Frame%201000002518.png"
								alt="Centered Image">
						</td>
					</tr>
				</table>
				<table
					style="max-width: 600px; margin: 0 auto; background-color: #fff; padding-top: 24px; padding-right: 24px; padding-left: 24px; padding-bottom: 40px;">
					<tr>
						<td colspan="2"
							style=" font-size: 16px; line-height: 21px; color: #101928; letter-spacing: -0.2px; font-family: 'Inter', 'Arial', sans-serif;">
							Account Deletion Request,
						</td>
					</tr>
					<tr>
						<td colspan="2"
							style=" font-size: 16px; line-height: 21px; color: #101928; letter-spacing: -0.2px; padding-top: 24px; font-family: 'Inter', 'Arial', sans-serif;">
							[FIRSTNAME], [LASTNAME], [EMAIL], [PHONE], [BUSINESS_NAME], [REASONS].
						</td>
					</tr>
					<tr>
						<td
							style=" font-size: 16px; line-height: 21px; color: #101928; letter-spacing: -0.2px; padding-top: 24px; font-family: 'Inter', 'Arial', sans-serif;">
							Best regards, <br>
							Team GoSource. 💚
						</td>
					</tr>
				</table>
			</td>
		</tr>
	</table>
</body>

</html>
