<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily COB Low Stock Report</title>
    <link href="https://fonts.cdnfonts.com/css/graphik-trial" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
</head>

<body>
    <table style="width: 100%; max-width: 600px; margin: 0 auto; background-color: #fff;">
        <style>
            @import url('https://fonts.cdnfonts.com/css/graphik-trial');
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap');
        </style>
        <tr>
            <td>
                <table style="width: 100%; max-width: 600px; margin: 0 auto; background-color: #fff;">
                    <tr>
                        <td style="text-align: left; font-weight: 400; line-height: 21px; letter-spacing: -0.2px; color: #101928; font-family: 'Inter', 'Arial', sans-serif; width: 100%; background-color: #09420C; color: #fff; padding: 24px; font-size: 24px; font-weight: bold; margin-left: 0;"
                            colspan="2">
                            <img src="https://gosource.sfo3.cdn.digitaloceanspaces.com/Frame%201000002518.png" alt="GoSource">
                        </td>
                    </tr>
                </table>
                <table style="padding-top: 40px; padding-right: 24px; padding-left: 24px; padding-bottom: 24px; width: 100%;">
                    <tr>
                        <td colspan="2" style="font-size: 18px; color: #101928; font-family: 'Inter', 'Arial', sans-serif; ">Daily COB Low Stock Report,</td>
                    </tr>
                    <tr>
                        <td style="font-size: 20px; padding-top: 24px; font-family: 'Inter', 'Arial', sans-serif; " colspan="2" class="greeting"><b>Here are the items sold today that are currently low or out of stock! ⚠️</b></td>
                    </tr>
                    <tr>
                        <td style="padding-top: 24px; font-size: 16px; color: #101928; font-family: 'Inter', 'Arial', sans-serif; " colspan="2">
                            Please review the affected inventory below:
                        </td>
                    </tr>
                    <tr>
                        <td style="padding-top: 24px; font-size: 16px; color: #101928; font-family: 'Inter', 'Arial', sans-serif; " colspan="2">
                            Date: [DATE]
                        </td>
                    </tr>
                </table>
                <!-- REPORT TABLE -->
                <table style=" padding-bottom: 24px; max-width: 600px; width: 100%; font-family: 'Inter', 'Arial', sans-serif; padding-left: 24px; padding-right: 24px;">
                    <tr>
                        <td class="receipt-wrap">
                            <table class="receipt" style="background: none; border-collapse: collapse; width: 100%;">
                                <tr>
                                    <td style="height: 32px; padding-top: 8px; padding-bottom: 8px; border-bottom: 1px solid #E4E7EC;">
                                        <b>Product</b></td>
                                    <td style="text-align: center; height: 32px; padding-top: 8px; padding-bottom: 8px; border-bottom: 1px solid #E4E7EC;">
                                        <b>Quantity Left</b></td>
                                    <td style="text-align: right; white-space: nowrap; height: 32px; padding-top: 8px; padding-bottom: 8px; border-bottom: 1px solid #E4E7EC;"
                                        class="right"><b>Status</b></td>
                                </tr>
                                [PRODUCTS_TABLE_ROWS]
                            </table>
                        </td>
                    </tr>
                </table>
                <table>
                    <tr>
                        <td style=" font-size: 16px; line-height: 21px; color: #101928; letter-spacing: -0.2px; font-family: 'Inter', 'Arial', sans-serif; padding-top: 24px;  text-align: left; padding-right: 24px; padding-left: 24px; padding-bottom: 24px; width: 100%;">
                            Best regards, <br>
                            Team GoSource. 💚
                        </td>
                    </tr>
                </table>
                <!-- footer -->
                <table style="max-width: 600px; margin: 0 auto; background-color: #F9FAFB; padding-top: 32px; padding-right: 24px; padding-left: 24px; padding-bottom: 32px; font-family: 'Inter', 'Arial', sans-serif; font-size: 14px;">
                    <tr>
                        <td colspan="2" style="font-size: 16px; line-height: 21px; color: #101928; letter-spacing: -0.2px; padding-bottom: 20px; font-family: 'Inter', 'Arial', sans-serif; font-size: 14px;">
                            Facing any problems? send a mail to <a style="color: #19B820;" href="mailto:admin@ipc-africa.com">admin@ipc-africa.com</a>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
